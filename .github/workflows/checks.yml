# Pull request checks: the pipeline's tests on the runner the monthly build uses, so a change to the pipeline is tested
# on Linux before it merges, and the site's own tests, so a change to the site is too (D-101), and the public build with its readiness
# checks (plain English, no tracking, page metadata, a performance budget). Tests only: this workflow never pulls from NZTA or Stats NZ
# and holds no write permission.
name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The same action versions as monthly-build.yml (Node 24, D-012).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Nothing here pushes, so the job's token is not left in the checkout's git config for the steps after it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dependencies
        run: pip install --disable-pip-version-check --no-input -r pipeline/requirements.txt

      - name: Contract, guardrail and invariant tests
        run: python -m pytest pipeline/tests -q -p no:cacheprovider

      # The query service prototype (docs/QUERY_SERVICE.md) answers from a built cube, and its tests are skipped without
      # one, so a run with no cube would report them as passing. The newest published cube release is taken the way
      # deploy.yml takes it, about 3 MB; no release is a failure, not a skip. So is a release without the fact table
      # (the tests skip without it), and so is any test that reports as skipped. They run here because this job already
      # has Python and DuckDB. They need nothing from the pipeline's own tests, which run first.
      - name: Query service prototype tests
        env:
          GH_TOKEN: ${{ github.token }}
        # pipefail: the tests' output is piped to tee below, and without it a failing test would pass the step.
        shell: bash
        run: |
          set -o pipefail
          release='[.[] | select((.draft | not) and (.tag_name | test("^cube-[0-9]{4}-[0-9]{2}$")) and any(.assets[]; .name == "public-data.tar.gz")) | .tag_name] | sort | last // empty'
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "$release")
          if [ -z "$tag" ]; then
            echo "No cube release to test the query service against." >&2
            exit 1
          fi
          mkdir -p public/data
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern public-data.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/public-data.tar.gz" -C public/data
          echo "Cube: release $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -d public/data/facts ]; then
            echo "The cube release $tag has no fact table (facts/), so the query service's tests would all be skipped." >&2
            exit 1
          fi
          python -m pytest scripts/query_service_prototype -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/query-service-tests.txt"
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/query-service-tests.txt"; then
            echo "A query service test was skipped; a skipped test tested nothing." >&2
            exit 1
          fi

  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The same Node and cache as deploy.yml.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts, as deploy.yml: no dependency runs an install script on the runner.
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `astro sync` writes the types the site's code is checked against (.astro/types.d.ts), which `astro build` would
      # also write, but the build needs a cube and takes longer. TypeScript is not a dependency of the site, so it is
      # fetched for the check, at the version the check was written against.
      - name: Types
        run: |
          npx astro sync
          npx -y -p typescript@7.0.2 tsc --noEmit

      - name: Site tests
        run: node --test "tests/site/*.test.ts"

  # The public build and what a visitor would meet in it: the same build the deploy makes (INTERNAL_PAGES=false), held to the quality bar of
  # work order 3's lane C. None of it needs a secret, and nothing here writes: the job's own read-only token reads a published release.
  # It runs beside the other jobs, so it adds no waiting.
  public-site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The newest published cube release, taken as deploy.yml takes it (every page of releases is read, D-146; its steps explain the
      # filter), read only. No release is a failure, not a skip: the pages these checks read are built from it.
      - name: The newest cube
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release='[.[] | select((.draft | not) and (.tag_name | test("^cube-[0-9]{4}-[0-9]{2}$")) and any(.assets[]; .name == "public-data.tar.gz")) | .tag_name] | .[]'
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq "$release")
          tag=$(printf '%s\n' $tags | sort | tail -n 1)
          if [ -z "$tag" ]; then
            echo "No cube release to build the public site from." >&2
            exit 1
          fi
          mkdir -p public/data
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern public-data.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/public-data.tar.gz" -C public/data
          echo "Cube: release $tag" | tee -a "$GITHUB_STEP_SUMMARY"

      # The public build, as deploy.yml makes it. PUBLIC_QUERY_SERVICE is not set: a build that sent questions to another address would fail
      # the no-tracking check below.
      - name: Build the public site
        env:
          INTERNAL_PAGES: "false"
        run: |
          npx astro build
          node scripts/check-public-build.mjs

      # Nothing a visitor reads holds a decision number, a dataset id or another word of the project's workings (config/narrative/plain_english.json).
      - name: Plain English
        run: node scripts/check-plain-english.mjs

      # No tracker, no cookie, no request to another origin (config/public_privacy.json).
      - name: No tracking
        run: node scripts/check-no-tracking.mjs

      # A title, a description and a card for every page, and each card image in place (config/site.json, meta).
      - name: Page titles, descriptions and cards
        run: node scripts/check-page-metadata.mjs

      # No page ships more on first load than its budget (config/performance_budget.json). --report lists every page's bytes in the log.
      - name: Performance budget
        run: node scripts/check-performance-budget.mjs --report

      # The timed half: the canvas's first chart on the throttled phone profile fails the pull request when its median is over first_chart_ms
      # (config/performance_budget.json, 3,000 ms), or when no chart is drawn. The profile slows the processor four times relative to the machine
      # it runs on, and the limit was set on the maintainer's computer. The first run on a runner (4 processors) read a median of 2,645 ms, against
      # 2,703 to 2,772 ms on the maintainer's computer, so the limit holds here, but a runner under load may read slower. If it does, the limit is config: raise it, with the reason, in the
      # pull request that needs it (D-156). The tool and the browser are pinned by .github/first-load's own lockfile, outside the site's
      # dependencies. Two steps so that a browser that cannot be downloaded does not fail the job (the byte check above still ran) while a time
      # over the limit does: the first records whether the browser is there, the second runs only if it is.
      - name: Browser for the first-chart timing
        id: browser
        continue-on-error: true
        run: |
          if npm ci --prefix .github/first-load --ignore-scripts --no-audit --no-fund && .github/first-load/node_modules/.bin/playwright-core install chromium-headless-shell; then
            chrome=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -n 1)
          fi
          if [ -z "$chrome" ]; then
            echo "The browser could not be installed, so the first chart's time was not checked on this run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"

      - name: First chart time
        if: steps.browser.outputs.chrome != ''
        timeout-minutes: 8
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
        run: |
          set -o pipefail
          status=0
          node scripts/check-first-load.mjs --playwright .github/first-load --chrome "$CHROME" > "$RUNNER_TEMP/first-load.txt" 2>&1 || status=$?
          { echo '```'; cat "$RUNNER_TEMP/first-load.txt"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
