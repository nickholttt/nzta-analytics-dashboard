# Builds the public site from the newest cube and uploads it to Cloudflare Pages (D-055, D-056, D-057). Runs when the
# monthly build starts it after building a month, on a push to main that changes the site, and by hand. Two jobs. The
# first builds the site and holds no secret. The second uploads it: it names the environment "production", which only
# main can use and which is where the Cloudflare secrets live, so no other branch's workflow can read them, and the
# site's own dependencies are never installed beside the token. Nothing is uploaded until deploying is switched on by
# the repository variable CLOUDFLARE_PAGES_PROJECT; until then the site is built and the run stops, so the build is
# still checked. On a ref whose site has no public build (a branch cut from main before the site reached it with #46)
# it stops before building.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "public/geo/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
      - ".github/deploy/**"
  # Also how monthly-build.yml starts a deploy, and only when it built a month.
  workflow_dispatch:

permissions:
  contents: read
  # To fall back to a monthly build's cube artifact before the first cube release exists.
  actions: read

# A newer deploy of the same ref makes an older one pointless; a run on another branch never cancels one on main.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upload: ${{ steps.plan.outputs.upload }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      # The same action versions as monthly-build.yml where they overlap (Node 24, D-012).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The public build needs the site's switch for it, src/lib/site.ts, which reached main with ui/explore (#46). A
      # branch cut from main before then carries the old local reference page, which must not be built as the public site.
      - name: Is the public site here
        id: site
        run: |
          if [ -f src/lib/site.ts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not built: $GITHUB_REF_NAME has no public build (src/lib/site.ts), so the site has not reached it yet." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.site.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # --ignore-scripts: no dependency runs an install script on the runner. The only ones in the lockfile are esbuild's,
      # which only checks its binary (the platform package carries it), and fsevents', for macOS.
      - name: Dependencies
        if: steps.site.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The newest snapshot's cube: the newest published cube-YYYY-MM release that carries the cube's file (one whose
      # upload failed has none), or before the first release, the newest unexpired artifact a monthly build uploaded.
      # Tags and artifact names end in the snapshot month, so the largest name is the newest.
      - name: The newest cube
        if: steps.site.outputs.ready == 'true'
        run: |
          mkdir -p public/data
          release='[.[] | select((.draft | not) and (.tag_name | test("^cube-[0-9]{4}-[0-9]{2}$")) and any(.assets[]; .name == "public-data.tar.gz")) | .tag_name] | sort | last // empty'
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "$release")
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern public-data.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/public-data.tar.gz" -C public/data
            echo "Cube: release $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            newest='[.artifacts[] | select((.name | startswith("public-data-")) and (.expired | not))] | sort_by(.name) | last'
            name=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "$newest | .name // empty")
            if [ -z "$name" ]; then
              echo "No cube release and no unexpired cube artifact: nothing to build the site from." >&2
              exit 1
            fi
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "$newest | .workflow_run.id")
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir public/data
            echo "Cube: artifact $name (no cube release yet)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          node -p "'Snapshot ' + require('./public/data/manifest.json').latest_snapshot" | tee -a "$GITHUB_STEP_SUMMARY"

      # The internal pages, /status and /sense-check, stay off the public site (D-056): INTERNAL_PAGES=false drops the
      # links to them, and the pages themselves are removed from the build. A link to one that a later change lets back
      # in (an island reading the switch in the browser, where it reads as unset) fails the deploy here. The check
      # looks for the site's own paths only: a path that follows a letter, a digit, a slash or a colon is part of a
      # longer address, such as a source link in events.json that has a /status/ segment, and is not a link to a page here.
      - name: Build the public site
        if: steps.site.outputs.ready == 'true'
        env:
          INTERNAL_PAGES: "false"
        run: |
          npx astro build
          rm -rf dist/status dist/sense-check
          if grep -rlE '(^|[^A-Za-z0-9_~%/:-])/(status|sense-check)([^A-Za-z0-9_-]|$)' dist; then
            echo "The public build links to an internal page, in the files above." >&2
            exit 1
          fi

      # The upload job is started only when it has something to do. A job that names an environment is recorded as a
      # deployment to it, so starting it to find the secrets missing would show a deployment that never happened. This
      # job cannot see the environment's secrets, so the switch is a repository variable.
      - name: Will it be uploaded
        id: plan
        if: steps.site.outputs.ready == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Built but not uploaded: only main deploys, and this run is on $GITHUB_REF_NAME." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -z "$PROJECT" ]; then
            echo "Built but not uploaded: deploying is not switched on. It is switched on by setting the repository variable CLOUDFLARE_PAGES_PROJECT to the Cloudflare Pages project's name." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      # Only what is about to be published, and only when it is: the artifact of a public repository can be downloaded
      # by anyone signed in to GitHub.
      - name: Hand the built site to the upload job
        if: steps.plan.outputs.upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1
          # A re-run of the whole workflow builds again under the same run id, and the name is taken by then.
          overwrite: true
          if-no-files-found: error

  upload:
    needs: build
    if: needs.build.outputs.upload == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      # Deploying was switched on, so missing secrets are a fault, not a state to wait in.
      - name: The Cloudflare secrets are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "Not uploaded: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be secrets of the environment 'production'." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

      # Only the upload tool's folder: this job needs none of the site's source.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/deploy

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Wrangler is pinned by its own lockfile in .github/deploy, outside the site's dependencies (D-057), and installed
      # before the step that holds the Cloudflare token.
      - name: Upload tool
        run: npm ci --prefix .github/deploy --no-audit --no-fund

      - name: The built site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name site --dir dist

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
