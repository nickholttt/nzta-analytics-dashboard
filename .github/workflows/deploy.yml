# Builds the public site from the newest cube and uploads it to Cloudflare Pages (D-055, D-056, D-057). Runs after each
# successful monthly build, on a push to main that changes the site, and by hand. It uploads only from main and only
# once the Cloudflare secrets exist; until then it builds the site and stops, so the build is still checked. On a ref
# whose site has no public build yet (before ui/explore reaches main) it stops before building.
name: Deploy

on:
  workflow_run:
    workflows: ["Monthly build"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "public/geo/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
      - ".github/deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  # To fall back to a monthly build's cube artifact before the first cube release exists.
  actions: read

# A newer deploy of the same ref makes an older one pointless; a run on another branch never cancels one on main.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # After a monthly build only when it succeeded: a failed run leaves the last good cube, which is already deployed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nz-vehicle-registrations' }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # The same action versions as monthly-build.yml where they overlap (Node 24, D-012).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The public build needs the site's switch for it, src/lib/site.ts, which reaches main with ui/explore (CHECKPOINT
      # item 4). Before then main carries the old local reference page, which must not be built as the public site.
      - name: Is the public site here
        id: site
        run: |
          if [ -f src/lib/site.ts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not built: $GITHUB_REF_NAME has no public build (src/lib/site.ts), so the site has not reached it yet." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.site.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies
        if: steps.site.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      # The newest snapshot's cube: the newest published cube-YYYY-MM release that carries the cube's file (one whose
      # upload failed has none), or before the first release, the newest unexpired artifact a monthly build uploaded.
      # Tags and artifact names end in the snapshot month, so the largest name is the newest.
      - name: The newest cube
        if: steps.site.outputs.ready == 'true'
        run: |
          mkdir -p public/data
          release='[.[] | select((.draft | not) and (.tag_name | test("^cube-[0-9]{4}-[0-9]{2}$")) and any(.assets[]; .name == "public-data.tar.gz")) | .tag_name] | sort | last // empty'
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "$release")
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern public-data.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/public-data.tar.gz" -C public/data
            echo "Cube: release $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            newest='[.artifacts[] | select((.name | startswith("public-data-")) and (.expired | not))] | sort_by(.name) | last'
            name=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "$newest | .name // empty")
            if [ -z "$name" ]; then
              echo "No cube release and no unexpired cube artifact: nothing to build the site from." >&2
              exit 1
            fi
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "$newest | .workflow_run.id")
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir public/data
            echo "Cube: artifact $name (no cube release yet)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          node -p "'Snapshot ' + require('./public/data/manifest.json').latest_snapshot" | tee -a "$GITHUB_STEP_SUMMARY"

      # The internal pages, /status and /sense-check, stay off the public site (D-056): INTERNAL_PAGES=false drops the
      # links to them, and the pages themselves are removed from the build. A link to one that a later change lets back
      # in (an island reading the switch in the browser, where it reads as unset) fails the deploy here.
      - name: Build the public site
        if: steps.site.outputs.ready == 'true'
        env:
          INTERNAL_PAGES: "false"
        run: |
          npx astro build
          rm -rf dist/status dist/sense-check
          if grep -rlE 'href="/(status|sense-check)|"/(status|sense-check)"' dist; then
            echo "The public build links to an internal page, in the files above." >&2
            exit 1
          fi

      # Wrangler is pinned by its own lockfile in .github/deploy, outside the site's dependencies (D-057), and installed
      # before the step that holds the Cloudflare token.
      - name: Upload tool
        if: steps.site.outputs.ready == 'true' && env.ON_MAIN == 'true' && env.HAS_TOKEN == 'true'
        run: npm ci --prefix .github/deploy --no-audit --no-fund

      - name: Upload to Cloudflare Pages
        if: steps.site.outputs.ready == 'true' && env.ON_MAIN == 'true' && env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Not uploaded
        if: steps.site.outputs.ready == 'true' && (env.ON_MAIN != 'true' || env.HAS_TOKEN != 'true')
        run: |
          if [ "$ON_MAIN" != "true" ]; then
            echo "Built but not uploaded: only main deploys, and this run is on $GITHUB_REF_NAME." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Built but not uploaded: the CLOUDFLARE_API_TOKEN secret is not set." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
